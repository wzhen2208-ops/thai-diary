<script>
"use strict";
const byId = id => document.getElementById(id);
const {groups, thaiByRank, missingAudio, dataPath = "freq2000", storagePrefix = "freq2000:",
       legacyPath = "freq2000/legacy_v1.json", progressByRank, version = ""} =
  JSON.parse(byId("freq-config").textContent);
const unavailable = new Set(missingAudio);
const cache = new Map();
const wordKey = thai => "w:" + thai;
const progressKey = rank => progressByRank ? "card:" + rank : wordKey(thaiByRank[rank - 1]);
const progress = new Map();
const audio = byId("audio");
const audioStatus = byId("audio-status");
let activeGroup = null;
let lastGroup = read("last-group");
let request = 0;
let playback = null;
let audioSessionInitialized = false;
let words = [];
let deck = [];
let history = [];
let position = 0;
let listView = false;

function read(key) {
  try { return localStorage.getItem(storagePrefix + key); } catch { return null; }
}

function save(key, value) {
  try {
    if (value === null) localStorage.removeItem(storagePrefix + key);
    else localStorage.setItem(storagePrefix + key, value);
  } catch {}
}

async function migrateProgress() {
  try {
    if (progressByRank || read("migrated") === "1") return;
    const ranks = [];
    for (let index = 0; index < localStorage.length; index++) {
      const key = localStorage.key(index);
      if (key?.startsWith(storagePrefix) && /^[1-9][0-9]*$/.test(key.slice(storagePrefix.length))) {
        ranks.push(key.slice(storagePrefix.length));
      }
    }
    if (!ranks.length) return;
    const response = await fetch(version ? `${legacyPath}?v=${version}` : legacyPath);
    if (!response.ok) return;
    const legacy = await response.json();
    if (ranks.some(rank => typeof legacy[rank] !== "string" || !legacy[rank])) return;

    for (const rank of ranks) {
      const status = localStorage.getItem(storagePrefix + rank);
      const target = storagePrefix + wordKey(legacy[rank]);
      if ((status === "k" || status === "u") && localStorage.getItem(target) === null) {
        localStorage.setItem(target, status);
      }
    }
    for (const rank of ranks) localStorage.removeItem(storagePrefix + rank);
    localStorage.setItem(storagePrefix + "migrated", "1");
  } catch {
    // A failed fetch or blocked write leaves any unconverted progress available for a later load.
  }
}

function loadProgress() {
  for (let rank = 1; rank <= thaiByRank.length; rank++) {
    const key = progressKey(rank);
    const status = read(key);
    if (status === "k" || status === "u") progress.set(key, status);
  }
}

function node(tag, text = "", className = "") {
  const element = document.createElement(tag);
  element.textContent = text;
  element.className = className;
  return element;
}

function label(group) {
  return `第${groups.indexOf(group) + 1}组 · ${group.first}–${group.first + group.count - 1}`;
}

function counts(group) {
  let known = 0;
  let unknown = 0;
  for (let rank = group.first; rank < group.first + group.count; rank++) {
    const status = progress.get(progressKey(rank));
    if (status === "k") known++;
    if (status === "u") unknown++;
  }
  return {known, unknown};
}

function renderPicker() {
  let knownTotal = 0;
  let seenTotal = 0;
  let wordTotal = 0;
  const choices = groups.map(group => {
    const {known, unknown} = counts(group);
    const seen = known + unknown;
    knownTotal += known;
    seenTotal += seen;
    wordTotal += group.count;
    const button = node("button", "", "group-choice");
    button.type = "button";
    button.dataset.file = group.file;
    button.append(node("strong", label(group)),
                  node("span", `✓ ${known} 认识 · ${seen}/${group.count} 已刷`));
    button.addEventListener("click", () => openGroup(group));
    return button;
  });
  byId("groups").replaceChildren(...choices);
  byId("overall").textContent = `总进度 · 认识 ${knownTotal} · 已刷 ${seenTotal} / ${wordTotal}`;
  byId("overall-bar").max = wordTotal;
  byId("overall-bar").value = seenTotal;
  const resume = groups.find(group => group.file === lastGroup);
  byId("resume").hidden = !resume;
  if (resume) {
    byId("resume").textContent = `继续 · ${label(resume)}`;
    byId("resume").onclick = () => openGroup(resume);
  }
}

function showPicker(focus = true) {
  request++;
  stopAudio();
  byId("group").hidden = true;
  byId("picker").hidden = false;
  byId("load-status").textContent = "";
  renderPicker();
  if (focus && activeGroup) {
    byId("groups").querySelector(`[data-file="${activeGroup.file}"]`).focus();
  }
}

async function openGroup(group) {
  const loading = ++request;
  byId("load-status").textContent = `正在加载${label(group)}…`;
  let items = cache.get(group.file);
  try {
    if (!items) {
      const response = await fetch(`${dataPath}/${group.file}.json` + (version ? `?v=${version}` : ""));
      if (!response.ok) throw new Error("Group request failed");
      items = await response.json();
      if (!Array.isArray(items) || items.length !== group.count) {
        throw new Error("Group response has an invalid word count");
      }
      cache.set(group.file, items);
    }
    await progressReady;
  } catch {
    if (request === loading) byId("load-status").textContent = "词表加载失败，请再点一次。";
    return;
  }
  if (request !== loading) return;

  activeGroup = group;
  words = items;
  lastGroup = group.file;
  save("last-group", lastGroup);
  byId("load-status").textContent = "";
  byId("picker").hidden = true;
  byId("group").hidden = false;
  byId("group-title").textContent = label(group);
  byId("next").disabled = groups.indexOf(group) === groups.length - 1;
  listView = false;
  startDeck(byId("unknown-only").checked);
  window.scrollTo(0, 0);
  byId("group-title").focus({preventScroll: true});
}

function startDeck(onlyUnknown) {
  deck = onlyUnknown ? words.filter(word => progress.get(progressKey(word.rank)) !== "k") : words;
  position = 0;
  history = [];
  renderCard();
}

function romanization(word) {
  if (!word.roman) {
    const message = dataPath === "mekong900" ? "读音待核实，听视频" : "读音待核实";
    return node("div", message, "review-note");
  }
  const roman = node("div", "", "roman");
  word.roman.split("·").forEach((syllable, index) => {
    const tone = word.tones[index];
    const part = node("span", syllable, `syllable tone-${tone}`);
    part.append(node("span", tone, "badge"));
    if (index > 0) roman.append(node("span", "·"));
    roman.append(part);
  });
  return roman;
}

function markersFor(word) {
  const markers = [];
  if (word.diary) markers.push(node("span", "日记已学", "marker"));
  if (word.freq2000) markers.push(node("span", "2000词里有", "marker"));
  if (word.duplicate_of) markers.push(node("span", `重复 · #${word.duplicate_of}`, "marker"));
  if (word.flag) {
    const flag = node("span", "待核实", "marker flag");
    flag.title = word.flag;
    markers.push(flag);
  }
  return markers;
}

function appendDetails(container, word, expanded) {
  if (word.flag && progressByRank) container.append(node("p", word.flag, "review-note"));
  if (word.review_note) container.append(node("p", word.review_note, "review-note"));
  if (word.part) {
    const seconds = Math.floor(word.offset);
    const time = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    const timestamp = node(word.video ? "a" : "span", `第${word.part}段 · ${time}`, "video-time");
    if (word.video) {
      timestamp.href = word.video;
      timestamp.target = "_blank";
      timestamp.rel = "noopener";
    }
    container.append(timestamp);
  }
  if (!word.compound) return;
  // Always shown expanded once the answer is visible; the summary cannot collapse it.
  const details = node("details", "", "compound");
  details.open = true;
  const summary = node("summary", word.compound.flag ? "复合词拆解 · 待核实" : "复合词拆解");
  summary.addEventListener("click", event => event.preventDefault());
  details.append(summary);
  const parts = node("ul");
  for (const part of word.compound.components) {
    const row = node("li");
    const thai = node("strong", part.thai);
    thai.lang = "th";
    row.append(thai, node("span", " · ", "sep"), romanization(part), node("span", " · ", "sep"),
               node("span", part.zh, "part-zh"));
    parts.append(row);
  }
  if (parts.childElementCount) details.append(parts);
  if (word.compound.note) details.append(node("p", word.compound.note, "review-note"));
  container.append(details);
}

function canPlay(word) {
  return !unavailable.has(word.audio.split("/").pop());
}

function stopAudio() {
  playback = null;
  audio.pause();
  audioStatus.textContent = "";
}

function reportAudioError() {
  stopAudio();
  audioStatus.textContent = "没有声音？请确认音量已调大、手机没有连着蓝牙耳机，再点一次。";
}

audio.addEventListener("error", () => {
  if (playback && audio.error) reportAudioError();
});

function play(word) {
  stopAudio();
  if (!canPlay(word)) return;
  if (!audioSessionInitialized) {
    audioSessionInitialized = true;
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
    } catch {}
  }

  if (audio.getAttribute("src") !== word.audio || audio.error) {
    audio.src = word.audio;
    audio.load();
  } else {
    audio.currentTime = 0;
  }
  const current = {};
  playback = current;
  audio.play().catch(error => {
    if (playback === current && error.name !== "AbortError") reportAudioError();
  });
}

function showView() {
  byId("study").hidden = listView || position === deck.length;
  byId("summary").hidden = listView || position !== deck.length;
  byId("word-list").hidden = !listView;
  byId("view").setAttribute("aria-pressed", listView);
  byId("view").textContent = listView ? "闪卡" : "词表";
}

function renderCard() {
  const focusedInStudy = byId("study").contains(document.activeElement);
  stopAudio();
  showView();
  byId("previous").disabled = !history.length;
  byId("summary-previous").disabled = !history.length;
  const word = deck[position];
  if (!word) {
    const {known, unknown} = counts(activeGroup);
    byId("results").textContent = `认识 ${known} / 没印象 ${unknown}`;
    byId("retry").disabled = known === words.length;
    if (!listView && focusedInStudy) byId("results").focus();
    return;
  }
  const reverse = byId("reverse").checked;
  const front = byId("front");
  front.textContent = reverse ? (word.zh || "中文待核实") : word.thai;
  front.lang = reverse ? "zh-CN" : "th";
  byId("position").textContent = `${position + 1} / ${deck.length}`;
  byId("markers").replaceChildren(...markersFor(word));
  byId("card").setAttribute("aria-expanded", "false");
  byId("reveal-label").hidden = false;
  byId("answer").hidden = true;
  byId("speak").disabled = !canPlay(word);
}

function reveal() {
  const word = deck[position];
  if (!word || !byId("answer").hidden) return;
  const reverse = byId("reverse").checked;
  const answer = node("div", reverse ? word.thai : (word.zh || "中文待核实"));
  answer.lang = reverse ? "th" : "zh-CN";
  byId("translation").replaceChildren(answer, romanization(word));
  appendDetails(byId("translation"), word, true);
  byId("answer").hidden = false;
  byId("reveal-label").hidden = true;
  byId("card").setAttribute("aria-expanded", "true");
  if (byId("autoplay").checked) play(word);
}

function rate(status) {
  if (byId("study").hidden || byId("group").hidden) return;
  const key = progressKey(deck[position].rank);
  history.push(progress.get(key) ?? null);
  progress.set(key, status);
  save(key, status);
  position++;
  renderCard();
}

function previous() {
  if (!history.length) return;
  position--;
  const key = progressKey(deck[position].rank);
  const status = history.pop();
  if (status === null) progress.delete(key);
  else progress.set(key, status);
  save(key, status);
  renderCard();
  if (document.activeElement === document.body || document.activeElement.disabled) {
    byId("card").focus({preventScroll: true});
  }
}

function renderList() {
  const names = {k: "认识", u: "没印象"};
  byId("word-list").replaceChildren(...words.map(word => {
    const row = node("li", "", "word-row");
    const status = progress.get(progressKey(word.rank));
    const dot = node("span", "", status ? `dot ${status}` : "dot");
    dot.setAttribute("role", "img");
    dot.setAttribute("aria-label", names[status] || "未刷");
    const text = node("div");
    const thai = node("div", word.thai);
    thai.lang = "th";
    text.append(thai, romanization(word), node("div", word.zh || "中文待核实"));
    const markers = markersFor(word);
    if (markers.length) {
      const badges = node("div", "", "word-markers");
      badges.append(...markers);
      text.append(badges);
    }
    appendDetails(text, word, false);
    const speak = node("button", "🔊", "speak");
    speak.type = "button";
    speak.setAttribute("aria-label", `播放发音 · ${word.thai}`);
    speak.disabled = !canPlay(word);
    speak.addEventListener("click", () => play(word));
    row.append(dot, text, speak);
    return row;
  }));
}

for (const [id, fallback] of [["reverse", false], ["autoplay", true], ["unknown-only", false]]) {
  const setting = byId(id);
  const stored = read(id);
  setting.checked = stored === null ? fallback : stored === "1";
  setting.addEventListener("change", () => {
    save(id, setting.checked ? "1" : "0");
    if (id === "unknown-only") startDeck(setting.checked);
    if (id === "reverse") renderCard();
  });
}

for (const id of ["back", "done"]) byId(id).onclick = () => showPicker();
byId("view").onclick = () => {
  stopAudio();
  listView = !listView;
  if (listView) renderList();
  showView();
};
byId("known").onclick = () => rate("k");
byId("unknown").onclick = () => rate("u");
for (const id of ["previous", "summary-previous"]) byId(id).onclick = previous;
byId("retry").onclick = () => {
  startDeck(true);
  byId("card").focus({preventScroll: true});
};
byId("next").onclick = () => {
  const next = groups[groups.indexOf(activeGroup) + 1];
  if (next) {
    showPicker(false);
    window.scrollTo(0, 0);
    openGroup(next);
  }
};
byId("speak").onclick = () => play(deck[position]);

let gesture = null;
let swiped = false;
const card = byId("card");
const surface = card.closest(".study-card");
surface.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;
  swiped = false;
  if (event.target.closest("a, summary, #speak")) return;
  gesture = {id: event.pointerId, x: event.clientX, y: event.clientY};
});
surface.addEventListener("pointercancel", () => { gesture = null; });
surface.addEventListener("pointerup", event => {
  if (gesture?.id !== event.pointerId) return;
  const dx = event.clientX - gesture.x;
  const dy = event.clientY - gesture.y;
  gesture = null;
  if (Math.abs(dx) >= 45 && Math.abs(dx) > 1.4 * Math.abs(dy)) {
    swiped = true;
    rate(dx > 0 ? "k" : "u");
  }
});
card.onclick = event => {
  if (!swiped || event.detail === 0) reveal();
  swiped = false;
};
document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey ||
      event.metaKey || event.shiftKey || event.target.closest("input") ||
      byId("group").hidden || byId("study").hidden) return;
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  event.preventDefault();
  rate(event.key === "ArrowRight" ? "k" : "u");
});

loadProgress();
showPicker(false);
const progressReady = migrateProgress().then(() => {
  loadProgress();
  renderPicker();
});
</script>
</body></html>
